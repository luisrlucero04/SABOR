<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABOR - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/png" href="../img/Logo.png">
</head>
<body>
    <header>

        <a href="bienvenida.html" class="back-btn" aria-label="Volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8l-4 4 4 4M16 12H8"/>
            </svg>
        </a>

        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="107" height="107" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </header>


    <main class="login-container">
        <h1>Iniciar Sesión</h1>

        <form class="login-form">
            <div class="input-group">
                <label for="email">Correo:</label>
                <div class="input-wrapper">
                    <span class="icon">✉</span>
                    <input type="email" id="email" placeholder="example@hotmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="********************" required>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#">Olvidó su contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesion</button>
        </form>

        <div class="register-link">
            <p>No tiene una cuenta registrada? <a href="../html/register.html">Crear cuenta</a></p>
        </div>
    </main>


</body>
</html>
