<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan</title>
  <link rel="stylesheet" href="../css/scan.css">
  <link rel="icon" type="image/png" href="../img/Logo.png">
</head>
<body>
  <main class="screen">

    <!-- Parte superior coral -->
    <section class="hero">
      <!-- Botón volver -->
      <a href="inicio.html" class="back" aria-label="Volver">
        <svg xmlns="http:/
        
        /www.w3.org/2000/svg" width="36" height="24" viewBox="0 0 36 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="#fff" stroke="none"/>
          <path d="M16 12H8M12 8l-4 4 4 4" stroke="#ff7a7a" stroke-width="2"/>
          <path d="M22 12h13" stroke="#fff" stroke-width="2"/>
        </svg>
      </a>

      <!-- Ola blanca -->
      <svg class="wave" viewBox="0 0 328 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 32C50 14 120 6 155 38c35 44 105 54 173 17V90H0Z" fill="#fff"/>
      </svg>
    </section>

    <!-- Contenido -->
    <section class="content">
      <h1>Sube tu recibo</h1>
      <p>Captura o selecciona una foto clara de tu recibo para que podamos identificar los productos y encontrar recetas con lo que compraste.</p>

      <!-- Zona para subir la imagen -->
      <div class="dropzone">
        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="84" viewBox="0 0 96 84" fill="none" stroke="#a3a3a3" stroke-width="4" aria-hidden="true">
          <rect x="2" y="2" width="92" height="20"/>
          <path d="M8 22v58h80V22"/>
          <path d="M38 40h20" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Botones -->
      <div class="acciones">
        <button type="button" class="btn">Subir fotos</button>
        <button type="button" class="btn">Tomar fotos</button>
      </div>
    </section>

    <!-- Botón continuar -->
    <footer class="footer">
      <a href="view-edit.html" class="next">
        <span>Continuar</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="#F87171" stroke="none"/>
          <path d="M12 8l4 4-4 4M8 12h8" stroke="white" stroke-width="2"/>
        </svg>
      </a>
    </footer>

  </main>
</body>
</html>
