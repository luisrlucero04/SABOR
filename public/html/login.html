<body>
    <header>
        <a href="bienvenida.html" class="back-btn" aria-label="Volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    </header>

    <main class="login-container">
        <h1>Iniciar Sesión</h1>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="email">Correo:</label>
                <div class="input-wrapper">
                    <span class="icon">✉</span>
                    <input type="email" id="email" placeholder="example@hotmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="********************" required>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPassword">Olvidó su contraseña?</a>
            </div>

            <p id="mensajeError" style="color: red; text-align: center;"></p>

            <button type="submit" class="btn-submit">Iniciar Sesion</button>
        </form>

        <div class="register-link">
            <p>No tiene una cuenta registrada? <a href="../html/register.html">Crear cuenta</a></p>
        </div>
    </main>
