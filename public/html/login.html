<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABOR - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/png" href="../img/Logo.png">
</head>
<body>
    <header>
        <a href="bienvenida.html" class="back-btn" aria-label="Volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8l-4 4 4 4M16 12H8"/>
            </svg>
        </a>
        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="107" height="107" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </header>

    <main class="login-container">
        <h1>Iniciar Sesión</h1>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="email">Correo:</label>
                <div class="input-wrapper">
                    <span class="icon">✉</span>
                    <input type="email" id="email" placeholder="example@hotmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="********************" required>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPassword">Olvidó su contraseña?</a>
            </div>

            <p id="mensajeError" style="color: red; text-align: center;"></p>

            <button type="submit" class="btn-submit">Iniciar Sesion</button>
        </form>

        <div class="register-link">
            <p>No tiene una cuenta registrada? <a href="../html/register.html">Crear cuenta</a></p>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        // Configuración de tu proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAWAaOMrgUMIBoF3juw8hBbsFDvOQbe8Dg",
            authDomain: "sabor-2ef5c.firebaseapp.com",
            projectId: "sabor-2ef5c",
            storageBucket: "sabor-2ef5c.firebasestorage.app",
            messagingSenderId: "415510937397",
            appId: "1:415510937397:web:4af14bde21908d72ba167c",
            measurementId: "G-YXNDJQC9TX"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        const form = document.getElementById("loginForm");
        const mensajeError = document.getElementById("mensajeError");

        // Manejo del envío del formulario de login
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            mensajeError.style.color = "red";
            mensajeError.textContent = "";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Login exitoso, redirige a tu página principal
                    window.location.href = "inicio.html";
                })
                .catch((error) => {
                    let msg = "Ocurrió un error al iniciar sesión";
                    if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password") {
                        msg = "Correo o contraseña incorrectos";
                    } else if (error.code === "auth/user-not-found") {
                        msg = "No existe una cuenta con ese correo";
                    } else if (error.code === "auth/invalid-email") {
                        msg = "El correo no es válido";
                    }
                    mensajeError.textContent = msg;
                });
        });

        // Manejo de "Olvidó su contraseña"
        document.getElementById("forgotPassword").addEventListener("click", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            if (!email) {
                mensajeError.style.color = "red";
                mensajeError.textContent = "Escribe tu correo arriba para poder enviarte el enlace";
                return;
            }
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    mensajeError.style.color = "green";
                    mensajeError.textContent = "Te enviamos un correo para restablecer tu contraseña";
                })
                .catch(() => {
                    mensajeError.style.color = "red";
                    mensajeError.textContent = "No pudimos enviar el correo, revisa que esté bien escrito";
                });
        });
    </script>
</body>
</html>
