<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABOR - Registrarse</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="icon" type="image/png" href="../img/Logo.png">
</head>
<body>

    <header>
        <a href="login.html" class="back-btn" aria-label="Volver">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8l-4 4 4 4M16 12H8"/>
            </svg>
        </a>

        <div class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="107" height="107" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="16" y1="11" x2="22" y2="11"/>
            </svg>
        </div>
    </header>

    <main class="register-container">
        <h1>Registro</h1>

        <form class="register-form" id="registerForm">
            <div class="input-group">
                <label for="nombre">Primer Nombre:</label>
                <input type="text" id="nombre" placeholder="Primer nombre" required>
            </div>

            <div class="input-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" placeholder="Apellido" required>
            </div>

            <div class="input-group">
                <label for="email">Correo:</label>
                <input type="email" id="email" placeholder="example@hotmail.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="*************" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" placeholder="*************" required>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    Aceptar términos y condiciones <a href="#">de datos personales</a>
                </label>
            </div>

            <p id="mensajeError" style="color: red; text-align: center;"></p>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

        <div class="login-link">
            <p>Ya tiene una cuenta registrada? <a href="login.html">Iniciar sesión</a></p>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // Configuración del proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAWAaOMrgUMIBoF3juw8hBbsFDvOQbe8Dg",
            authDomain: "sabor-2ef5c.firebaseapp.com",
            projectId: "sabor-2ef5c",
            storageBucket: "sabor-2ef5c.firebasestorage.app",
            messagingSenderId: "415510937397",
            appId: "1:415510937397:web:4af14bde21908d72ba167c",
            measurementId: "G-YXNDJQC9TX"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("registerForm");
        const mensajeError = document.getElementById("mensajeError");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            mensajeError.textContent = "";

            const nombre = document.getElementById("nombre").value;
            const apellido = document.getElementById("apellido").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            // Validación: las contraseñas coinciden
            if (password !== confirmPassword) {
                mensajeError.textContent = "Las contraseñas no coinciden";
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // Guarda el nombre en el perfil de autenticación
                    updateProfile(user, {
                        displayName: `${nombre} ${apellido}`
                    });

                    // Guarda datos adicionales en Firestore
                    return setDoc(doc(db, "usuarios", user.uid), {
                        nombre: nombre,
                        apellido: apellido,
                        email: email,
                        creadoEn: new Date()
                    });
                })
                .then(() => {
                    alert("¡Cuenta creada con éxito!");
                    window.location.href = "login.html";
                })
                .catch((error) => {
                    let msg = "Ocurrió un error al registrarse";
                    if (error.code === "auth/email-already-in-use") {
                        msg = "Ya existe una cuenta con ese correo";
                    } else if (error.code === "auth/weak-password") {
                        msg = "La contraseña debe tener al menos 6 caracteres";
                    } else if (error.code === "auth/invalid-email") {
                        msg = "El correo no es válido";
                    }
                    mensajeError.textContent = msg;
                });
        });
    </script>
</body>
</html>
